name: ShopEase Regression Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Selenium Tests in CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests (Headless)
        run: mvn clean test -Dbrowser=chrome -Dheadless=true

      - name: Upload Test Results and Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-execution-reports
          path: |
            target/surefire-reports/
            reports/
          retention-days: 7
